<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUXE — Premium Lifestyle Store</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --gold: #c9a96e;
    --dark: #0a0a0a;
    --cream: #f5f1ea;
    --gray: #8a8a8a;
  }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--cream);
    color: var(--dark);
    overflow-x: hidden;
  }
  .announcement {
    background: var(--dark);
    color: var(--cream);
    text-align: center;
    padding: 10px;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 24px 60px;
    background: var(--cream);
    border-bottom: 1px solid rgba(0,0,0,0.05);
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(10px);
  }
  .logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 32px;
    font-weight: 500;
    letter-spacing: 4px;
  }
  .nav-links {
    display: flex;
    gap: 40px;
    list-style: none;
  }
  .nav-links a {
    text-decoration: none;
    color: var(--dark);
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: color 0.3s;
  }
  .nav-links a:hover { color: var(--gold); }
  .nav-icons {
    display: flex;
    gap: 20px;
    align-items: center;
  }
  .icon-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 18px;
    color: var(--dark);
    position: relative;
  }
  .cart-count {
    position: absolute;
    top: -8px;
    right: -10px;
    background: var(--gold);
    color: white;
    font-size: 10px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .hero {
    height: 85vh;
    background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)),
                url('https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=1600') center/cover;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: white;
  }
  .hero-content h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 96px;
    font-weight: 300;
    letter-spacing: 8px;
    margin-bottom: 20px;
    line-height: 1;
  }
  .hero-content p {
    font-size: 14px;
    letter-spacing: 4px;
    margin-bottom: 40px;
    text-transform: uppercase;
    opacity: 0.9;
  }
  .btn-primary {
    background: var(--gold);
    color: white;
    padding: 16px 48px;
    border: none;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s;
  }
  .btn-primary:hover {
    background: white;
    color: var(--dark);
  }
  .section { padding: 100px 60px; }
  .section-header { text-align: center; margin-bottom: 60px; }
  .section-header .subtitle {
    color: var(--gold);
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .section-header h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 48px;
    font-weight: 400;
    letter-spacing: 2px;
  }
  .categories {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }
  .category-card {
    height: 500px;
    background-size: cover;
    background-position: center;
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }
  .category-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.3);
    transition: background 0.4s;
  }
  .category-card:hover::before { background: rgba(0,0,0,0.5); }
  .category-info {
    position: absolute;
    bottom: 40px;
    left: 40px;
    color: white;
    z-index: 2;
  }
  .category-info h3 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 36px;
    font-weight: 400;
    margin-bottom: 8px;
  }
  .category-info span {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-bottom: 1px solid var(--gold);
    padding-bottom: 4px;
  }
  .products-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 30px;
  }
  .product-card {
    cursor: pointer;
    transition: transform 0.3s;
  }
  .product-card:hover { transform: translateY(-5px); }
  .product-image {
    height: 380px;
    background: #e8e3da;
    background-size: cover;
    background-position: center;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }
  .product-badge {
    position: absolute;
    top: 16px;
    left: 16px;
    background: var(--dark);
    color: white;
    padding: 6px 12px;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .quick-add {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--dark);
    color: white;
    padding: 14px;
    text-align: center;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    transform: translateY(100%);
    transition: transform 0.3s;
    border: none;
    cursor: pointer;
    width: 100%;
  }
  .product-card:hover .quick-add { transform: translateY(0); }
  .product-info h4 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 500;
    margin-bottom: 6px;
  }
  .product-info .price {
    color: var(--gold);
    font-size: 14px;
    letter-spacing: 1px;
  }
  .features {
    background: var(--dark);
    color: var(--cream);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    padding: 60px;
    gap: 40px;
  }
  .feature { text-align: center; }
  .feature-icon {
    font-size: 32px;
    color: var(--gold);
    margin-bottom: 16px;
  }
  .feature h5 {
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .feature p {
    font-size: 13px;
    opacity: 0.7;
    line-height: 1.6;
  }
  .editorial {
    display: grid;
    grid-template-columns: 1fr 1fr;
    height: 600px;
  }
  .editorial-image {
    background: url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=1200') center/cover;
  }
  .editorial-text {
    background: var(--cream);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 80px;
  }
  .editorial-text .subtitle {
    color: var(--gold);
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  .editorial-text h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 56px;
    font-weight: 400;
    line-height: 1.1;
    margin-bottom: 24px;
  }
  .editorial-text p {
    font-size: 15px;
    line-height: 1.8;
    color: var(--gray);
    margin-bottom: 32px;
  }
  .btn-outline {
    background: transparent;
    color: var(--dark);
    border: 1px solid var(--dark);
    padding: 14px 40px;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    align-self: flex-start;
    transition: all 0.3s;
  }
  .btn-outline:hover {
    background: var(--dark);
    color: var(--cream);
  }
  .newsletter {
    text-align: center;
    padding: 100px 60px;
    background: var(--cream);
  }
  .newsletter h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 48px;
    margin-bottom: 16px;
    font-weight: 400;
  }
  .newsletter p {
    color: var(--gray);
    margin-bottom: 32px;
    font-size: 14px;
  }
  .newsletter-form {
    display: flex;
    max-width: 500px;
    margin: 0 auto;
    border-bottom: 1px solid var(--dark);
  }
  .newsletter-form input {
    flex: 1;
    background: transparent;
    border: none;
    padding: 16px;
    font-size: 14px;
    outline: none;
    font-family: inherit;
  }
  .newsletter-form button {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--gold);
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 16px 24px;
  }
  footer {
    background: var(--dark);
    color: var(--cream);
    padding: 80px 60px 40px;
  }
  .footer-grid {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr;
    gap: 60px;
    margin-bottom: 60px;
  }
  .footer-brand h3 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    letter-spacing: 4px;
    margin-bottom: 16px;
  }
  .footer-brand p {
    font-size: 13px;
    line-height: 1.8;
    opacity: 0.7;
    max-width: 300px;
  }
  .footer-col h6 {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 20px;
    color: var(--gold);
  }
  .footer-col ul { list-style: none; }
  .footer-col li { margin-bottom: 12px; }
  .footer-col a {
    color: var(--cream);
    text-decoration: none;
    font-size: 13px;
    opacity: 0.7;
    transition: opacity 0.3s;
  }
  .footer-col a:hover { opacity: 1; }
  .footer-bottom {
    border-top: 1px solid rgba(255,255,255,0.1);
    padding-top: 30px;
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    opacity: 0.6;
  }
  .cart-drawer {
    position: fixed;
    top: 0;
    right: -450px;
    width: 450px;
    height: 100vh;
    background: white;
    box-shadow: -5px 0 30px rgba(0,0,0,0.1);
    transition: right 0.4s;
    z-index: 1000;
    display: flex;
    flex-direction: column;
  }
  .cart-drawer.open { right: 0; }
  .cart-header {
    padding: 30px;
    border-bottom: 1px solid #eee;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .cart-header h3 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 24px;
  }
  .close-cart {
    background: none;
    border: none;
    font-size: 24px;
    cursor: pointer;
  }
  .cart-items {
    flex: 1;
    overflow-y: auto;
    padding: 30px;
  }
  .cart-empty {
    text-align: center;
    color: var(--gray);
    margin-top: 100px;
  }
  .cart-footer {
    padding: 30px;
    border-top: 1px solid #eee;
  }
  .cart-total {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
    font-size: 18px;
  }
  .cart-total strong {
    font-family: 'Cormorant Garamond', serif;
  }
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    z-index: 999;
  }
  .overlay.active {
    opacity: 1;
    pointer-events: all;
  }
  @media (max-width: 768px) {
    nav { padding: 16px 20px; }
    .nav-links { display: none; }
    .hero-content h1 { font-size: 48px; }
    .section { padding: 60px 20px; }
    .categories, .products-grid, .features { grid-template-columns: 1fr; }
    .editorial { grid-template-columns: 1fr; }
    .editorial-text { padding: 40px 20px; }
    .footer-grid { grid-template-columns: 1fr; }
    .cart-drawer { width: 100%; }
  }
</style>
</head>
<body>

<div class="announcement">Complimentary shipping on orders over $200 — International delivery available</div>

<nav>
  <div class="logo">LUXE</div>
  <ul class="nav-links">
    <li><a href="#">New In</a></li>
    <li><a href="#">Collections</a></li>
    <li><a href="#">Women</a></li>
    <li><a href="#">Men</a></li>
    <li><a href="#">Editorial</a></li>
  </ul>
  <div class="nav-icons">
    <button class="icon-btn">⌕</button>
    <button class="icon-btn">♡</button>
    <button class="icon-btn" onclick="toggleCart()">
      ◫
      <span class="cart-count" id="cartCount">0</span>
    </button>
  </div>
</nav>

<section class="hero">
  <div class="hero-content">
    <h1>LUXE</h1>
    <p>Autumn / Winter Collection 2025</p>
    <button class="btn-primary">Discover the Collection</button>
  </div>
</section>

<section class="section">
  <div class="section-header">
    <div class="subtitle">Curated for You</div>
    <h2>Shop by Category</h2>
  </div>
  <div class="categories">
    <div class="category-card" style="background-image: url('https://images.unsplash.com/photo-1483985988355-763728e1935b?w=800')">
      <div class="category-info">
        <h3>Women</h3>
        <span>Shop Now</span>
      </div>
    </div>
    <div class="category-card" style="background-image: url('https://images.unsplash.com/photo-1490578474895-699cd4e2cf59?w=800')">
      <div class="category-info">
        <h3>Men</h3>
        <span>Shop Now</span>
      </div>
    </div>
    <div class="category-card" style="background-image: url('https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=800')">
      <div class="category-info">
        <h3>Accessories</h3>
