<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Spider-Man Gallery</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #0f172a;
            color: #ffffff;
            padding: 20px;
            margin: 0;
        }
        h1 {
            margin-top: 10px;
            margin-bottom: 25px;
            font-size: 24px;
            color: #38bdf8;
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .card {
            background-color: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            max-width: 320px;
            width: 100%;
        }
        .card img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <h1>আমার স্পাইডারম্যান গ্যালারি</h1>

    <div class="gallery">
        <!-- ছবি ১ -->
        <div class="card">
            <img src="1.jpg" alt="Spider-Man 1">
        </div>

        <!-- ছবি ২ -->
        <div class="card">
            <img src="2.jpg" alt="Spider-Man 2">
        </div>

        <!-- ছবি ৩ -->
        <div class="card">
            <img src="3.jpg" alt="Spider-Man 3">
        </div>
    </div>

</body>
</html>
