<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Gallery</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #0f172a;
            color: #ffffff;
            padding: 20px;
            margin: 0;
        }
        h1 {
            margin-top: 10px;
            margin-bottom: 25px;
            font-size: 24px;
            color: #38bdf8;
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .card {
            background-color: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            max-width: 320px;
            width: 100%;
        }
        .card img, .card video {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <h1>আমার ছবি ও ভিডিও গ্যালারি</h1>

    <div class="gallery">
        <!-- ছবি ১ -->
        <div class="card">
            <img src="IMG_1000101269.jpg" alt="Photo 1">
        </div>

        <!-- ছবি ২ -->
        <div class="card">
            <img src="IMG_1000091960.jpg" alt="Photo 2">
        </div>

        <!-- ছবি ৩ -->
        <div class="card">
            <img src="IMG_1000048299.jpg" alt="Photo 3">
        </div>

        <!-- ছবি ৪ -->
        <div class="card">
            <img src="IMG_1000047627.jpg" alt="Photo 4">
        </div>

        <!-- ছবি ৫ -->
        <div class="card">
            <img src="IMG_1000047628.jpg" alt="Photo 5">
        </div>

        <!-- ভিডিও -->
        <div class="card">
            <video controls>
                <source src="VID_1000111218.mp4" type="video/mp4">
                আপনার ব্রাউজার ভিডিওটি সাপোর্ট করছে না।
            </video>
        </div>
    </div>

</body>
                </html>
