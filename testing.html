<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital OMR Evaluator - HSC ICT Project</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .omr-card {
            background: white;
            width: 100%;
            max-width: 550px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            border-top: 6px solid #006a4e;
        }
        h2 { text-align: center; color: #006a4e; margin-bottom: 2px; }
        .sub { text-align: center; color: #666; font-size: 13px; margin-bottom: 20px; }
        
        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dashed #ddd;
        }
        .q-num { font-weight: bold; width: 60px; color: #333; }
        .bubbles { display: flex; gap: 15px; }
        
        /* OMR Bubble Design */
        .bubble {
            width: 28px;
            height: 28px;
            border: 2px solid #333;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            background: white;
            transition: 0.2s;
        }
        .bubble.filled {
            background: #222;
            color: white;
            border-color: #222;
        }

        .btn {
            width: 100%;
            background: #006a4e;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
        .btn:hover { background: #004d39; }

        #omr-result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="omr-card">
    <h2>🎯 Digital OMR Sheet Evaluator</h2>
    <div class="sub">HSC ICT বিজ্ঞান মেলা প্রজেক্ট - অটোমেটেড ওএমআর খাতা মূল্যায়ন</div>

    <!-- OMR Question 1 -->
    <div class="row" data-q="1">
        <span class="q-num">প্রশ্ন ১:</span>
        <div class="bubbles">
            <div class="bubble" onclick="fillBubble(this)">ক</div>
            <div class="bubble" onclick="fillBubble(this)">খ</div>
            <div class="bubble" onclick="fillBubble(this)">গ</div>
            <div class="bubble" onclick="fillBubble(this)">ঘ</div>
        </div>
    </div>

    <!-- OMR Question 2 -->
    <div class="row" data-q="2">
        <span class="q-num">প্রশ্ন ২:</span>
        <div class="bubbles">
            <div class="bubble" onclick="fillBubble(this)">ক</div>
            <div class="bubble" onclick="fillBubble(this)">খ</div>
            <div class="bubble" onclick="fillBubble(this)">গ</div>
            <div class="bubble" onclick="fillBubble(this)">ঘ</div>
        </div>
    </div>

    <!-- OMR Question 3 -->
    <div class="row" data-q="3">
        <span class="q-num">প্রশ্ন ৩:</span>
        <div class="bubbles">
            <div class="bubble" onclick="fillBubble(this)">ক</div>
            <div class="bubble" onclick="fillBubble(this)">খ</div>
            <div class="bubble" onclick="fillBubble(this)">গ</div>
            <div class="bubble" onclick="fillBubble(this)">ঘ</div>
        </div>
    </div>

    <!-- OMR Question 4 -->
    <div class="row" data-q="4">
        <span class="q-num">প্রশ্ন ৪:</span>
        <div class="bubbles">
            <div class="bubble" onclick="fillBubble(this)">ক</div>
            <div class="bubble" onclick="fillBubble(this)">খ</div>
            <div class="bubble" onclick="fillBubble(this)">গ</div>
            <div class="bubble" onclick="fillBubble(this)">ঘ</div>
        </div>
    </div>

    <!-- OMR Question 5 -->
    <div class="row" data-q="5">
        <span class="q-num">প্রশ্ন ৫:</span>
        <div class="bubbles">
            <div class="bubble" onclick="fillBubble(this)">ক</div>
            <div class="bubble" onclick="fillBubble(this)">খ</div>
            <div class="bubble" onclick="fillBubble(this)">গ</div>
            <div class="bubble" onclick="fillBubble(this)">ঘ</div>
        </div>
    </div>

    <button class="btn" onclick="evaluateOMR()">OMR খাতা স্ক্যান ও স্কোয়ার মূল্যায়ন করুন</button>

    <div id="omr-result"></div>
</div>

<script>
    // সঠিক উত্তরপত্র সেট (ক=0, খ=1, গ=2, ঘ=3)
    const answerKey = {
        1: 1, // প্রশ্ন ১ এর সঠিক উত্তর: খ
        2: 2, // প্রশ্ন ২ এর সঠিক উত্তর: গ
        3: 0, // প্রশ্ন ৩ এর সঠিক উত্তর: ক
        4: 1, // প্রশ্ন ৪ এর সঠিক উত্তর: খ
        5: 3  // প্রশ্ন ৫ এর সঠিক উত্তর: ঘ
    };

    // ওএমআর বৃত্ত ভরাট করার লজিক
    function fillBubble(el) {
        let parent = el.parentElement;
        let bubbles = parent.getElementsByClassName('bubble');
        
        // একই প্রশ্নের অন্য বৃত্ত খালি করা
        for (let b of bubbles) {
            b.classList.remove('filled');
        }
        
        // নির্বাচিত বৃত্তটি কালো করা
        el.classList.add('filled');
    }

    // অটোমেটিক খাতা মূল্যায়ন লজিক
    function evaluateOMR() {
        let score = 0;
        let rows = document.querySelectorAll('.row');
        let unattempted = 0;

        rows.forEach(row => {
            let qNum = row.getAttribute('data-q');
            let bubbles = row.querySelectorAll('.bubble');
            let selectedIndex = -1;

            bubbles.forEach((b, index) => {
                if (b.classList.contains('filled')) {
                    selectedIndex = index;
                }
            });

            if (selectedIndex === -1) {
                unattempted++;
            } else if (selectedIndex === answerKey[qNum]) {
                score++;
            }
        });

        let resultDiv = document.getElementById('omr-result');
        resultDiv.style.display = 'block';

        if (unattempted > 0) {
            resultDiv.style.background = '#fff3cd';
            resultDiv.style.color = '#856404';
            resultDiv.innerHTML = `⚠️ আপনি <strong>${unattempted}টি</strong> প্রশ্নের বৃত্ত ভরাট করেননি।<br>বর্তমান প্রাপ্ত নম্বর: <strong>${score} / 5</strong>`;
        } else {
            resultDiv.style.background = '#d4edda';
            resultDiv.style.color = '#155724';
            resultDiv.innerHTML = `✅ <strong>OMR স্ক্যান সফল!</strong><br>আপনার প্রাপ্ত নম্বর: <strong>${score} / 5</strong>`;
        }
    }
</script>

</body>
    </html>
