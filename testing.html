<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Logic Gate Simulator - HSC ICT</title>
    <style>
        body { font-family: Arial, sans-serif; background: #eef2f5; padding: 20px; display: flex; justify-content: center; }
        .card { background: white; width: 100%; max-width: 500px; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-top: 5px solid #006a4e; }
        h2 { color: #006a4e; text-align: center; }
        .input-group { margin: 15px 0; }
        select, button { width: 100%; padding: 10px; margin-top: 5px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; }
        button { background: #006a4e; color: white; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .result { margin-top: 20px; padding: 15px; background: #e8f5e9; border-radius: 5px; text-align: center; font-size: 18px; font-weight: bold; color: #2e7d32; }
    </style>
</head>
<body>

<div class="card">
    <h2>⚡ Digital Logic Gate Simulator</h2>
    <p style="text-align: center; color: #666;">C-Programming Logic & HTML Interface</p>

    <div class="input-group">
        <label>লজিক গেট নির্বাচন করুন:</label>
        <select id="gate">
            <option value="AND">AND Gate (&&)</option>
            <option value="OR">OR Gate (||)</option>
            <option value="NAND">NAND Gate</option>
            <option value="NOR">NOR Gate</option>
            <option value="XOR">XOR Gate</option>
        </select>
    </div>

    <div class="input-group">
        <label>ইনপুট A (0 অথবা 1):</label>
        <select id="inputA">
            <option value="0">0 (LOW)</option>
            <option value="1">1 (HIGH)</option>
        </select>
    </div>

    <div class="input-group">
        <label>ইনপুট B (0 অথবা 1):</label>
        <select id="inputB">
            <option value="0">0 (LOW)</option>
            <option value="1">1 (HIGH)</option>
        </select>
    </div>

    <button onclick="calculateGate()">আউটপুট নির্ণয় করুন</button>

    <div id="output" class="result">আউটপুট: -</div>
</div>

<script>
    // C Programming Logic implemented in JS
    function calculateGate() {
        int_a = parseInt(document.getElementById("inputA").value); // C type casting
        int_b = parseInt(document.getElementById("inputB").value);
        gate = document.getElementById("gate").value;
        let output = 0;

        // C Programming Conditional Logic (if-else)
        if (gate === "AND") {
            output = (int_a && int_b) ? 1 : 0;
        } else if (gate === "OR") {
            output = (int_a || int_b) ? 1 : 0;
        } else if (gate === "NAND") {
            output = !(int_a && int_b) ? 1 : 0;
        } else if (gate === "NOR") {
            output = !(int_a || int_b) ? 1 : 0;
        } else if (gate === "XOR") {
            output = (int_a !== int_b) ? 1 : 0;
        }

        document.getElementById("output").innerHTML = "আউটপুট (Output): " + output;
    }
</script>

</body>
    </html>
